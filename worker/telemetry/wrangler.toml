name = "banyancode-telemetry"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 binding — create the database first, then uncomment and fill in database_id:
#
#   wrangler d1 create banyancode-telemetry-db        # prints a database_id UUID
#   wrangler d1 execute banyancode-telemetry-db --remote --file schema.sql
#
# [[d1_databases]]
# binding = "DB"
# database_name = "banyancode-telemetry-db"
# database_id = "<uuid from `wrangler d1 create`>"

# Daily 03:00 UTC purge — fires the `scheduled` handler in src/index.ts, which enforces
# the 365-day retention mandate from specs/banyancode/install-telemetry.md.
[triggers]
crons = ["0 3 * * *"]
