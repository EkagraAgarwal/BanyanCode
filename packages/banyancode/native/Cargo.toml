[package]
name = "banyan-indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native parse/extract sidecar for the BanyanCode codegraph indexer"
license = "MIT"
publish = false

[[bin]]
name = "banyan-indexer"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-json = "0.24"
tree-sitter-zig = "1.1"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
ignore = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fancy-regex = "0.14"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
