# Auto-tag release versions. Triggers on push to main when
# packages/opencode/package.json changed. Creates an annotated tag `vX.Y.Z`
# from the current version, pushes it, then explicitly dispatches the publish
# workflow with the resolved version. The explicit dispatch is required
# because bot (GITHUB_TOKEN) tag pushes do not trigger `on: push: tags`
# workflows. Idempotent — re-runs with no version change are no-ops (no tag,
# no dispatch).
#
# `workflow_dispatch` is enabled so operators can manually re-tag HEAD after
# a fixup commit (e.g. after a hotfix landed before the tag push completed)
# via `gh workflow run tag-release` without first needing to revert and
# re-bump the version file.
#
# publish.yml keeps its `push: tags: v*` + `workflow_dispatch` triggers as
# recovery paths (e.g. PAT-created tags, manual backfill), but the normal
# path is this workflow's explicit dispatch — do not manually tag alongside
# the bot (see release/AGENTS.md §4).
name: Tag release

on:
  push:
    branches: [main]
    paths:
      - 'packages/opencode/package.json'
  workflow_dispatch:

# Without this the default GITHUB_TOKEN cannot push refs or dispatch
# workflows. The workflow only needs contents:write to push a single
# annotated tag, plus actions:write to explicitly dispatch publish.yml
# (bot-created tag pushes do not trigger downstream workflows).
permissions:
  contents: write
  actions: write

# Avoid concurrent runs of the same workflow (e.g. a fast push followed
# by a fixup push within seconds). Each run is idempotent so we could
# safely allow concurrency, but the lock keeps the run log clean.
concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release version
    runs-on: ubuntu-latest
    # The job needs the full history to list existing tags with ordering.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Read the version from package.json — single source of truth.
      # We deliberately re-parse on each run; trusting a previous
      # artifact would be a hazard if the file format ever drifted.
      - name: Read current version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/opencode/package.json').version")"
          if [ -z "${VERSION}" ]; then
            echo "::error::could not read version from packages/opencode/package.json"
            exit 1
          fi
          echo "current=${VERSION}" >> "${GITHUB_OUTPUT}"

      # Find the most recent v* tag. `git tag --sort=-v:refname` orders by
      # version per the vX.Y.Z convention; for the CalVer range we ship
      # lexical order matches calendar order. We strip the leading "v"
      # so we can compare apples-to-apples in the next step.
      - name: Find latest v* tag
        id: latest
        shell: bash
        run: |
          # Use `git describe --tags --abbrev=0` (no pipe, no SIGPIPE).
          # Avoids the classic `git tag --list ... | head -n1` race where
          # `head` closes the pipe after one line, `git` writes more, and
          # the resulting SIGPIPE exits the script with 141. `|| echo ""`
          # makes the empty-repo case (first ever release) produce an empty
          # string instead of erroring.
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          if [ -n "${LATEST_TAG}" ]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"
            echo "version=${LATEST_VERSION}" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "tag=" >> "${GITHUB_OUTPUT}"
            echo "version=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Tag and push if newer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.current }}"
          EXISTS="${{ steps.latest.outputs.exists }}"
          LATEST_VERSION="${{ steps.latest.outputs.version }}"
          WANTED_TAG="v${CURRENT}"

          if [ "${EXISTS}" = "true" ] && [ "${CURRENT}" = "${LATEST_VERSION}" ]; then
            echo "Tag ${WANTED_TAG} already exists; nothing to do."
            exit 0
          fi

          if [ "${EXISTS}" = "true" ]; then
            # Compare CalVer lexically (works inside a year; cross-year
            # monotonicity also holds because YY is 2 digits).
            if [ "${CURRENT}" \< "${LATEST_VERSION}" ]; then
              echo "::warning::current version ${CURRENT} is lower than existing tag v${LATEST_VERSION}; refusing to overwrite published release."
              exit 1
            fi
            if [ "${CURRENT}" = "${LATEST_VERSION}" ]; then
              echo "Tag v${LATEST_VERSION} already on the remote; idempotent skip."
              exit 0
            fi
          fi

          echo "Creating tag ${WANTED_TAG} at HEAD (current version ${CURRENT})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${WANTED_TAG}" -m "BanyanCode ${CURRENT}" HEAD
          git push origin "${WANTED_TAG}"

          # Bot tag pushes do not trigger downstream workflows, so dispatch
          # publish.yml explicitly with the resolved version. This is the
          # sole normal trigger — `push: tags` and manual dispatch in
          # publish.yml remain as recovery paths only. Dispatching here
          # (only on the creation path above) avoids duplicate runs.
          echo "Dispatching publish.yml for version ${CURRENT}"
          gh workflow run publish.yml --ref "${WANTED_TAG}" -f version="${CURRENT}" --repo "${{ github.repository }}"
