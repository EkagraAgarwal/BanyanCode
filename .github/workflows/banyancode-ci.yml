name: banyancode-ci

on:
  push:
    branches: [v2-base, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: banyancode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history so the patch ledger can diff against the upstream base commit.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch ledger
        run: bun script/banyancode/patch-ledger.ts

      - name: Patch ledger tests
        working-directory: script/banyancode
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  # The whole product, not only the plugin: patches to the host broke host tests that nothing was running.
  test:
    name: test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [banyancode, banyancode-tui, banyancode-mcp, cli, tui, server, client, util, schema, core]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: bun run test
