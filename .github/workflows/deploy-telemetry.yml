name: deploy-telemetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/telemetry/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    if: github.repository == 'EkagraAgarwal/BanyanCode'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/telemetry
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Deploy worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply schema
        if: always()
        run: bunx wrangler d1 execute banyancode-telemetry-db --remote --file schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
